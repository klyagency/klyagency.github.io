<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Rutina Gym</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #00ff88; /* Verde neón */
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            /* Evita el scroll elástico molesto en móviles */
            overscroll-behavior-y: none; 
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding-bottom: 40px;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 30px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .workout-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }

        .workout-title {
            font-size: 1.4rem;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #fff;
        }

        .exercise-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .exercise-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .exercise-item:last-child {
            border-bottom: none;
        }

        .exercise-name {
            font-weight: 500;
            font-size: 1.05rem;
        }

        .muscle-group {
            font-size: 0.8rem;
            color: #121212;
            background: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            white-space: nowrap;
            margin-left: 15px;
        }

        .btn-completar {
            width: 100%;
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 30px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.2);
        }

        .btn-completar:active {
            transform: scale(0.98);
            background-color: #00cc6a;
        }

        .btn-reset {
            background: none;
            border: none;
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
            display: block;
            margin: 30px auto 0 auto;
            font-size: 0.95rem;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Rutina Hipertrofia</h1>
        <div class="subtitle" id="day-counter">Día 1 de 4</div>
        
        <div class="workout-card">
            <h2 class="workout-title" id="workout-name">Cargando...</h2>
            <ul class="exercise-list" id="exercise-list">
                </ul>
            <button class="btn-completar" onclick="completarEntrenamiento()">COMPLETADO 🔥</button>
        </div>

        <button class="btn-reset" onclick="reiniciarCiclo()">Empezar ciclo desde cero</button>
    </div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('Service Worker OK', reg))
            .catch(err => console.error('Error Service Worker', err));
        });
      }
    </script>

    <script>
        const rutina = [
            {
                nombre: "Pecho + Espalda + Bíceps",
                ejercicios: [
                    { nombre: "Press de banca plano", musculo: "Pecho" },
                    { nombre: "Press inclinado", musculo: "Pecho Sup." },
                    { nombre: "Peck deck", musculo: "Pecho" },
                    { nombre: "Jalón al pecho", musculo: "Dorsal" },
                    { nombre: "Remo pecho apoyado", musculo: "Espalda Med." },
                    { nombre: "Curl predicador", musculo: "Bíceps" },
                    { nombre: "Curl inclinado", musculo: "Bíceps" }
                ]
            },
            {
                nombre: "Pecho + Hombros + Tríceps",
                ejercicios: [
                    { nombre: "Press inclinado", musculo: "Pecho Sup." },
                    { nombre: "Press máquina", musculo: "Pecho" },
                    { nombre: "Elevaciones laterales", musculo: "Hombro Lat." },
                    { nombre: "Press de hombros", musculo: "Hombro" },
                    { nombre: "Extensión tríceps polea", musculo: "Tríceps" },
                    { nombre: "Extensión sobre cabeza", musculo: "Tríceps" }
                ]
            },
            {
                nombre: "Espalda + Bíceps + Tríceps",
                ejercicios: [
                    { nombre: "Dominadas / Jalón", musculo: "Dorsal" },
                    { nombre: "Remo en máquina", musculo: "Espalda Med." },
                    { nombre: "Curl martillo", musculo: "Bíceps" },
                    { nombre: "Curl en polea", musculo: "Bíceps" },
                    { nombre: "Extensión tríceps polea", musculo: "Tríceps" }
                ]
            },
            {
                nombre: "Pecho + Espalda + Hombros",
                ejercicios: [
                    { nombre: "Press de banca plano", musculo: "Pecho" },
                    { nombre: "Press inclinado mancuernas", musculo: "Pecho Sup." },
                    { nombre: "Peck deck", musculo: "Pecho" },
                    { nombre: "Remo en máquina", musculo: "Espalda Med." },
                    { nombre: "Pullover en polea", musculo: "Dorsal" },
                    { nombre: "Elevaciones laterales", musculo: "Hombro Lat." },
                    { nombre: "Reverse pec deck", musculo: "Hombro Post." }
                ]
            }
        ];

        let sesionActual = localStorage.getItem('sesionActual');
        if (sesionActual === null) {
            sesionActual = 0;
        } else {
            sesionActual = parseInt(sesionActual);
        }

        function cargarEntrenamiento() {
            const entreno = rutina[sesionActual];
            
            document.getElementById('day-counter').innerText = `Sesión ${sesionActual + 1} de 4`;
            document.getElementById('workout-name').innerText = entreno.nombre;
            
            const lista = document.getElementById('exercise-list');
            lista.innerHTML = ''; 

            entreno.ejercicios.forEach(ej => {
                const li = document.createElement('li');
                li.className = 'exercise-item';
                li.innerHTML = `
                    <span class="exercise-name">${ej.nombre}</span>
                    <span class="muscle-group">${ej.musculo}</span>
                `;
                lista.appendChild(li);
            });
        }

        function completarEntrenamiento() {
            sesionActual = (sesionActual + 1) % rutina.length;
            localStorage.setItem('sesionActual', sesionActual);
            
            // Un pequeño scroll hacia arriba y recarga la vista
            window.scrollTo(0, 0);
            cargarEntrenamiento();
        }

        function reiniciarCiclo() {
            if(confirm("¿Seguro que quieres volver a la Sesión 1?")) {
                sesionActual = 0;
                localStorage.setItem('sesionActual', 0);
                cargarEntrenamiento();
            }
        }

        // Iniciar
        cargarEntrenamiento();
    </script>
</body>
</html>
