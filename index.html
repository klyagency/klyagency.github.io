<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLY Agency | Cuenta atrás</title>

    
    <link rel="icon" type="image/png" href="favicon.png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            background: #000;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            /* padding más ajustado en móvil */
            overflow: hidden;
            position: relative;
        }

        /* Canvas de partículas */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 720px;
            width: 100%;
            position: relative;
            z-index: 1;
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
            padding: 10px 0;
            /* Centrado perfecto con flex del body */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            /* Ocupa la mayor parte de la pantalla */
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 85px;
            margin-bottom: 35px;
            opacity: .9;
            transition: opacity 0.3s ease;
            flex-shrink: 0;
        }

        .logo:hover {
            opacity: 1;
        }

        .small {
            color: #777;
            font-size: clamp(0.7rem, 2.5vw, 1rem);
            letter-spacing: 6px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .title {
            font-size: clamp(3.2rem, 12vw, 6rem);
            font-weight: 700;
            line-height: 1.1;
            margin: 6px 0 35px 0;
            letter-spacing: 2px;
        }

        .divider {
            width: 50px;
            height: 1px;
            background: #2a2a2a;
            margin: 0 auto 30px;
            flex-shrink: 0;
        }

        .message {
            color: #bdbdbd;
            font-size: clamp(0.95rem, 2.8vw, 1.15rem);
            line-height: 2;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 5px;
        }

        .message strong {
            color: #fff;
            font-weight: 600;
        }

        .year-highlight {
            display: inline-block;
            color: #fff;
            transition: text-shadow 0.3s ease;
        }

        .year-highlight:hover {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.12);
        }

        /* Ajustes específicos para móviles muy pequeños */
        @media (max-width: 480px) {
            body {
                padding: 15px;
                align-items: center;
            }

            .container {
                min-height: 70vh;
                padding: 5px 0;
            }

            .logo {
                width: 70px;
                margin-bottom: 25px;
            }

            .small {
                letter-spacing: 4px;
                font-size: 0.65rem;
            }

            .title {
                font-size: clamp(2.6rem, 14vw, 3.8rem);
                margin: 2px 0 25px 0;
            }

            .divider {
                width: 40px;
                margin-bottom: 22px;
            }

            .message {
                font-size: 0.9rem;
                line-height: 1.9;
                padding: 0 3px;
            }
        }

        @media (max-width: 360px) {
            .title {
                font-size: 2.4rem;
            }
            .message {
                font-size: 0.8rem;
                line-height: 1.8;
            }
            .logo {
                width: 60px;
                margin-bottom: 20px;
            }
        }

        /* Para pantallas muy altas o anchas, mantener centrado */
        @media (min-height: 900px) {
            .container {
                min-height: 60vh;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div class="container">

        <img src="favicon.png" alt="KLY Agency" class="logo">

        <div class="small">
            ESTAMOS EN
        </div>

        <h1 class="title">
            CUENTA ATRÁS
        </h1>

        <div class="divider"></div>

        <p class="message">
            2026 quizá no fue nuestro año.<br><br>

            La agencia no fue nuestro objetivo principal.<br><br>

            En el verano de <strong class="year-highlight">2027</strong>, todo va a cambiar:<br>
            el rumbo, el objetivo, el nicho...<br>
            <strong>Todo.</strong><br><br>

            Tiempo al tiempo.
        </p>

    </div>

    <script>
        // === PARTÍCULAS BLANCAS ===
        (function() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            const PARTICLE_COUNT = 50;
            const MAX_SPEED = 0.2;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            class Particle {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 1.6 + 0.6;
                    this.speedX = (Math.random() - 0.5) * MAX_SPEED * 2;
                    this.speedY = (Math.random() - 0.5) * MAX_SPEED * 2;
                    this.opacity = Math.random() * 0.4 + 0.15;
                }

                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;

                    if (this.x < 0 || this.x > width) this.speedX *= -1;
                    if (this.y < 0 || this.y > height) this.speedY *= -1;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                    ctx.fill();
                }
            }

            function initParticles() {
                particles = [];
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    particles.push(new Particle());
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);

                for (const p of particles) {
                    p.update();
                    p.draw();
                }

                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', () => {
                resize();
                initParticles();
            });

            resize();
            initParticles();
            animate();
        })();
    </script>

</body>
</html>
